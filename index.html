<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borrowly — Peer-to-Peer Rental Marketplace Cyprus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 antialiased flex flex-col min-h-screen">

    <!-- Header / Navbar -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-emerald-600 text-white p-2 rounded-xl">
                    <i class="fa-solid fa-arrows-rotate text-xl"></i>
                </div>
                <span class="text-2xl font-extrabold tracking-tight text-gray-900">Borrowly<span class="text-emerald-600">.cy</span></span>
            </div>
            
            <div class="flex items-center space-x-3">
                <select id="cityFilter" onchange="filterItems()" class="bg-gray-100 border border-gray-300 text-gray-700 text-sm rounded-lg p-2 font-medium focus:ring-2 focus:ring-emerald-500">
                    <option value="all">📍 All Cyprus</option>
                    <option value="Limassol">Limassol</option>
                    <option value="Nicosia">Nicosia</option>
                    <option value="Larnaca">Larnaca</option>
                    <option value="Paphos">Paphos</option>
                </select>
                <button onclick="openModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-4 py-2 rounded-xl transition-all shadow-sm">
                    + Post Item
                </button>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="bg-emerald-900 text-white py-12 px-4 text-center">
        <div class="max-w-3xl mx-auto space-y-4">
            <span class="inline-block bg-emerald-800 text-emerald-200 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">Cyprus's #1 P2P Rental Marketplace</span>
            <h1 class="text-3xl sm:text-5xl font-extrabold">Rent anything locally. Earn from what you own.</h1>
            <p class="text-emerald-100 text-sm sm:text-base">Safe deposit protection, verified lenders, and zero listing fees.</p>
        </div>
    </section>

    <!-- Category Pills -->
    <div class="max-w-7xl mx-auto px-4 pt-6 pb-2">
        <div class="flex space-x-2 overflow-x-auto pb-2 scrollbar-hide">
            <button onclick="filterCategory('all')" class="cat-btn bg-emerald-600 text-white px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap">All Items</button>
            <button onclick="filterCategory('Tools')" class="cat-btn bg-gray-200 text-gray-700 px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap">🛠️ Tools</button>
            <button onclick="filterCategory('Electronics')" class="cat-btn bg-gray-200 text-gray-700 px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap">📷 Tech & Cameras</button>
            <button onclick="filterCategory('Outdoor')" class="cat-btn bg-gray-200 text-gray-700 px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap">🏕️ Outdoor & Sports</button>
            <button onclick="filterCategory('Events')" class="cat-btn bg-gray-200 text-gray-700 px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap">🎉 Events & Party</button>
        </div>
    </div>

    <!-- Main Content / Grid -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
        <div id="itemsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Sample Items Loaded Dynamically -->
        </div>
    </main>

    <!-- Post Item Modal -->
    <div id="postModal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 max-w-md w-full space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold text-gray-900">List an Item on Borrowly</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
            </div>
            <form id="itemForm" onsubmit="handlePost(event)" class="space-y-3">
                <input type="text" id="itemTitle" placeholder="Item Name (e.g. GoPro Hero 11)" required class="w-full border rounded-xl p-2.5 text-sm">
                <div class="grid grid-cols-2 gap-2">
                    <select id="itemCat" class="border rounded-xl p-2.5 text-sm">
                        <option value="Tools">Tools</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Outdoor">Outdoor</option>
                        <option value="Events">Events</option>
                    </select>
                    <select id="itemCity" class="border rounded-xl p-2.5 text-sm">
                        <option value="Limassol">Limassol</option>
                        <option value="Nicosia">Nicosia</option>
                        <option value="Larnaca">Larnaca</option>
                        <option value="Paphos">Paphos</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" id="itemPrice" placeholder="Daily Price (€)" required class="border rounded-xl p-2.5 text-sm">
                    <input type="number" id="itemDeposit" placeholder="Deposit Hold (€)" required class="border rounded-xl p-2.5 text-sm">
                </div>
                <input type="url" id="itemImg" placeholder="Image URL (optional)" class="w-full border rounded-xl p-2.5 text-sm">
                <button type="submit" class="w-full bg-emerald-600 text-white font-semibold py-2.5 rounded-xl hover:bg-emerald-700">Publish Listing</button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 py-6 text-center text-xs text-gray-500">
        <p>© 2026 Borrowly Cyprus — Safe Peer-to-Peer Rental Marketplace</p>
    </footer>

    <script>
        const initialItems = [
            { id: 1, title: 'Bosch Professional Pressure Washer', cat: 'Tools', city: 'Limassol', price: 15, deposit: 50, img: 'https://images.unsplash.com/photo-1581092160607-ee22621dd758?w=500' },
            { id: 2, title: 'Sony Alpha a7 III Camera + Lens', cat: 'Electronics', city: 'Nicosia', price: 40, deposit: 200, img: 'https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=500' },
            { id: 3, title: '4-Person Camping Tent & Gear', cat: 'Outdoor', city: 'Larnaca', price: 20, deposit: 60, img: 'https://images.unsplash.com/photo-1504280390367-361c6d9f38f4?w=500' },
            { id: 4, title: 'PA Sound System with Microphones', cat: 'Events', city: 'Limassol', price: 50, deposit: 150, img: 'https://images.unsplash.com/photo-1545454675-3531b543be5d?w=500' }
        ];

        let currentCat = 'all';

        function renderItems() {
            const grid = document.getElementById('itemsGrid');
            const city = document.getElementById('cityFilter').value;
            grid.innerHTML = '';

            const items = JSON.parse(localStorage.getItem('borrowly_items')) || initialItems;

            const filtered = items.filter(item => {
                const matchCity = city === 'all' || item.city === city;
                const matchCat = currentCat === 'all' || item.cat === currentCat;
                return matchCity && matchCat;
            });

            if(filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500">No items listed in this category/city yet. Be the first to post!</div>`;
                return;
            }

            filtered.forEach(item => {
                grid.innerHTML += `
                    <div class="bg-white border border-gray-200 rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition-shadow">
                        <img src="${item.img || 'https://images.unsplash.com/photo-1584438784894-089d6a62b8fa?w=500'}" class="h-48 w-full object-cover">
                        <div class="p-4 space-y-3">
                            <div class="flex justify-between items-start">
                                <div>
                                    <span class="text-xs font-semibold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-md">${item.cat}</span>
                                    <h3 class="font-bold text-gray-900 mt-1">${item.title}</h3>
                                </div>
                                <span class="text-xs text-gray-500 font-medium">📍 ${item.city}</span>
                            </div>
                            <div class="flex justify-between items-center pt-2 border-t text-sm">
                                <div><span class="font-bold text-lg text-emerald-700">€${item.price}</span><span class="text-xs text-gray-500">/day</span></div>
                                <div class="text-xs text-gray-400">Escrow Hold: €${item.deposit}</div>
                            </div>
                            <button onclick="alert('Borrowly Booking Request sent to lender in ${item.city}!')" class="w-full bg-gray-900 hover:bg-emerald-600 text-white text-xs font-semibold py-2 rounded-xl transition-colors">Request Rental</button>
                        </div>
                    </div>
                `;
            });
        }

        function filterCategory(cat) {
            currentCat = cat;
            renderItems();
        }

        function filterItems() {
            renderItems();
        }

        function openModal() { document.getElementById('postModal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('postModal').classList.add('hidden'); }

        function handlePost(e) {
            e.preventDefault();
            const newItem = {
                id: Date.now(),
                title: document.getElementById('itemTitle').value,
                cat: document.getElementById('itemCat').value,
                city: document.getElementById('itemCity').value,
                price: Number(document.getElementById('itemPrice').value),
                deposit: Number(document.getElementById('itemDeposit').value),
                img: document.getElementById('itemImg').value
            };
            const existing = JSON.parse(localStorage.getItem('borrowly_items')) || initialItems;
            existing.unshift(newItem);
            localStorage.setItem('borrowly_items', JSON.stringify(existing));
            closeModal();
            renderItems();
        }

        renderItems();
    </script>
</body>
</html>
